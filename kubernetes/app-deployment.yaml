apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-jr-app
  namespace: devops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: devops-jr-app

  template:

    metadata:
      labels:
        app: devops-jr-app

    spec:

      containers:

      - name: devops-jr-app

        image: docker.io/library/devops-jr-app:1.4

        imagePullPolicy: IfNotPresent

        ports:

        - containerPort: 5000

        env:

        - name: DB_HOST
          value: postgres

        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD

        - name: DB_PORT
          value: "5432"
